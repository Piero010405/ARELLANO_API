<html>
<head>
    <title>iisnode logs</title>
    <style type="text/css">
        body
        {
            font-family: "Trebuchet MS" , Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
        }
        td, th
        {
            border: 1px solid lightgray;
            padding: 3px 7px 2px 7px;
        }
        th
        {
            text-align: left;
            padding-top: 5px;
            padding-bottom: 4px;
            background-color: Gray;
            color: #ffffff;
        }
        td.stderr
        {
            color: Red;
        }
    </style>
</head>
<body>
    <table id="logFilesTable">
        <tr>
            <th>
                Computer name
            </th>
            <th>
                PID
            </th>
            <th>
                Type
            </th>
            <th>
                Created
            </th>
            <th>
                Link
            </th>
        </tr>
    </table>
    <p id="lastUpdated"></p>
    <script type="text/javascript">

        // this is replaced with actual data at runtime by code in interceptor.js
        var logFiles = [{"file":"PELIAMAUDITORIA-11020-stderr-1755117899447.txt","computername":"PELIAMAUDITORIA","pid":11020,"type":"stderr","created":1755117899447},{"file":"PELIAMAUDITORIA-11020-stdout-1755117899445.txt","computername":"PELIAMAUDITORIA","pid":11020,"type":"stdout","created":1755117899445},{"file":"PELIAMAUDITORIA-11960-stderr-1755069807057.txt","computername":"PELIAMAUDITORIA","pid":11960,"type":"stderr","created":1755069807057},{"file":"PELIAMAUDITORIA-11960-stdout-1755069807057.txt","computername":"PELIAMAUDITORIA","pid":11960,"type":"stdout","created":1755069807057},{"file":"PELIAMAUDITORIA-3428-stderr-1755116763699.txt","computername":"PELIAMAUDITORIA","pid":3428,"type":"stderr","created":1755116763699},{"file":"PELIAMAUDITORIA-3428-stdout-1755116763697.txt","computername":"PELIAMAUDITORIA","pid":3428,"type":"stdout","created":1755116763697},{"file":"PELIAMAUDITORIA-5752-stderr-1755116989606.txt","computername":"PELIAMAUDITORIA","pid":5752,"type":"stderr","created":1755116989606},{"file":"PELIAMAUDITORIA-5752-stdout-1755116989605.txt","computername":"PELIAMAUDITORIA","pid":5752,"type":"stdout","created":1755116989605}];
        var lastUpdated = 1755117900712;
        var date = new Date();

        date.setTime(lastUpdated);
        document.getElementById('lastUpdated').innerHTML = 'Index was last updated ' + date;

        logFiles.sort(function (a, b) {
            return b.created - a.created;
        });

        var logFilesTable = document.getElementById("logFilesTable");
        for (var i = 0; i < logFiles.length; i++) {
            var logFile = logFiles[i];
            date.setTime(logFile.created);
            var row = logFilesTable.insertRow(-1);
            var computerNameCell = row.insertCell(0);
            var pidCell = row.insertCell(1);
            var typeCell = row.insertCell(2);
            var dateCell = row.insertCell(3);
            var logCell = row.insertCell(4);
            computerNameCell.innerHTML = logFile.computername;
            pidCell.innerHTML = logFile.pid.toString();
            typeCell.innerHTML = logFile.type;
            typeCell.setAttribute('class', logFile.type);
            dateCell.innerHTML = date.toString();
            logCell.innerHTML = '<a href="' + logFile.file + '">log</a>';
        };

    </script>
</body>
</html>
